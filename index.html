<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZESTMOK - 오목</title>
<meta name="description" content="ZEST와 함께하는 오목 대전">
<meta name="theme-color" content="#161616">
<!-- theme before first paint (no flash): saved choice, else the OS setting -->
<script>(function(){var t;try{t=localStorage.getItem('ohohmok-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='light'?'#f2f2f2':'#161616'})()</script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="ZESTMOK - 오목">
<meta property="og:description" content="ZEST와 함께하는 오목 대전">
<meta property="og:url" content="https://builtkwon.github.io/ZESTMOK/">
<meta property="og:image" content="https://builtkwon.github.io/ZESTMOK/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
  <script src="vendor/peerjs.min.js"></script>
</head>
<body>

<header>
  <div class="header-tools">
    <button type="button" class="icon-btn" id="theme-btn" aria-label="다크 모드" aria-pressed="true" onclick="toggleTheme()"></button>
  </div>
  <h1>ZESTMOK<span>오목 · GOMOKU</span></h1>
</header>

<div class="game-layout">
  <!-- Left Panel -->
  <div class="panel">
    <div class="player-card" id="card-black">
      <div style="display:flex;align-items:center">
        <div class="player-stone black"></div>
        <div>
          <div class="player-name" id="name-black">흑돌 <span class="player-badge" id="badge-black"></span></div>
          <div class="player-label" id="label-black">흑돌 · 선공</div>
          <div class="player-clock" id="clock-1"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="player-card" id="card-white">
      <div style="display:flex;align-items:center">
        <div class="player-stone white"></div>
        <div>
          <div class="player-name" id="name-white">백돌 <span class="player-badge" id="badge-white"></span></div>
          <div class="player-label" id="label-white">백돌 · 후공</div>
          <div class="player-clock" id="clock-2"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="score-section">
      <div class="score-label">전적</div>
      <div class="score-row">
        <div class="score-val" id="score-black">0</div>
        <div class="score-separator">:</div>
        <div class="score-val" id="score-white">0</div>
      </div>
    </div>

    <div class="divider"></div>

    <button class="btn" onclick="newGame()">새 게임</button>
    <button class="btn secondary" onclick="resetScore()">전적 초기화</button>
  </div>

  <!-- Board -->
  <div class="board-wrap">
    <div class="board-surface" id="board-surface">
      <canvas id="board-canvas"></canvas>
      <div class="stones-layer" id="stones-layer"></div>
      <div class="ghost-stone" id="ghost-stone"></div>
      <canvas class="board-click" id="board-click" tabindex="0" role="application" aria-label="오목판. 방향키로 이동하고 Enter 또는 스페이스로 착수합니다"></canvas>
      <div class="kb-cursor" id="kb-cursor"></div>
    </div>
    <div class="turn-indicator">
      <div class="turn-dot" id="turn-dot"></div>
      <span id="turn-text" role="status">흑돌 차례</span>
    </div>
    <div class="conn-status" id="conn-status" style="display:none"><div class="conn-dot" id="conn-dot"></div><span id="conn-text">연결됨</span></div>
    <div class="room-status err" id="team-banner" role="status" style="text-align:center;margin:6px 0 0"></div>
    <div class="ai-thinking" id="ai-thinking"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div><span style="margin-left:6px">AI 생각 중...</span></div>
  </div>

  <!-- Right panel (mirror) -->
  <div class="panel" style="visibility:hidden;pointer-events:none" aria-hidden="true"></div>
</div>

<!-- Mode selection overlay -->
<div class="mode-overlay show" id="mode-overlay">
  <div class="mode-modal" role="dialog" aria-modal="true" aria-labelledby="mode-title">
    <div class="mode-title" id="mode-title">ZESTMOK</div>
    <div class="mode-subtitle">오목 · 게임 모드 선택</div>
    <div class="mode-cards">
      <button type="button" class="mode-card" onclick="selectMode('ai')">
        <div class="mode-icon">🤖</div>
        <div class="mode-card-title">AI 대전</div>
        <div class="mode-card-desc">컴퓨터와<br>대결하기</div>
      </button>
      <button type="button" class="mode-card" onclick="selectMode('team')">
        <div class="mode-icon">👥</div>
        <div class="mode-card-title">방 만들기</div>
        <div class="mode-card-desc">친구와 대전<br>1:1 · 2:2 · 3:1</div>
      </button>
    </div>
  </div>
</div>

<!-- Rule (time control) category: 일반전 / 속기전 -->
<div class="mode-overlay" id="rule-overlay">
  <div class="mode-modal" role="dialog" aria-modal="true" aria-labelledby="rule-title">
    <div class="mode-title" id="rule-title">대국 방식</div>
    <div class="mode-subtitle" id="rule-sub">일반전 · 속기전 선택</div>
    <div class="mode-cards">
      <button type="button" class="mode-card" onclick="selectRule('n')">
        <div class="mode-icon">⏳</div>
        <div class="mode-card-title">일반전</div>
        <div class="mode-card-desc">시간 제한 선택<br>다 쓰면 초읽기</div>
      </button>
      <button type="button" class="mode-card" onclick="selectRule('b')">
        <span class="new-tag" aria-label="신규 모드">new!</span>
        <div class="mode-icon">⚡</div>
        <div class="mode-card-title">속기전</div>
        <div class="mode-card-desc">한 수 5초 · 10초<br>넘기면 즉시 패배</div>
      </button>
    </div>
    <button type="button" class="back-btn" onclick="ruleBack()">← 뒤로</button>
  </div>
</div>

<!-- Team mode overlay (entry + lobby) -->
<div class="room-overlay" id="team-overlay">
  <div class="room-modal" role="dialog" aria-modal="true" aria-labelledby="team-title">
    <div class="room-title" id="team-title">방 만들기</div>
    <div class="room-subtitle">ZESTMOK · 최대 4명 · 1:1 · 2:2 · 3:1</div>
    <div id="tv-entry">
      <input class="room-input team-name" id="team-name" maxlength="12" placeholder="닉네임" aria-label="닉네임" autocomplete="off">
      <div class="select-sub" id="tc-team-label">시간</div>
      <div class="level-choices" role="radiogroup" aria-labelledby="tc-team-label" data-tc></div>
      <div class="select-sub">방 만들기 (내 팀 선택)</div>
      <div class="level-choices">
        <button type="button" class="level-chip" onclick="teamCreate(1)">흑팀으로</button>
        <button type="button" class="level-chip" onclick="teamCreate(2)">백팀으로</button>
      </div>
      <div class="select-sub">방 참가</div>
      <input class="room-input" id="team-code" placeholder="CODE" maxlength="6" aria-label="방 코드" oninput="this.value=this.value.toUpperCase()">
      <button type="button" class="btn" onclick="teamJoin()">입장하기</button>
      <div class="room-status" id="team-status" role="status"></div>
    </div>
    <div id="tv-lobby" style="display:none">
      <button type="button" class="room-code-box" id="team-code-display" onclick="copyTeamCode()" title="클릭하여 복사" aria-label="방 코드 복사">----</button>
      <div class="room-code-hint">인원 <span id="team-count">1/4</span> · <span id="team-rule"></span></div>
      <div class="team-cols">
        <div class="team-col"><div class="team-col-title">흑팀</div><ul id="tl1"></ul><button type="button" class="btn secondary" id="tb1" onclick="teamPick(1)">흑팀 참가</button></div>
        <div class="team-col"><div class="team-col-title">백팀</div><ul id="tl2"></ul><button type="button" class="btn secondary" id="tb2" onclick="teamPick(2)">백팀 참가</button></div>
      </div>
      <button type="button" class="btn" id="team-start" onclick="teamStart()">시작</button>
      <div class="room-status" id="team-hint" role="status"></div>
    </div>
    <button type="button" class="back-btn" onclick="teamBack()">← 뒤로</button>
  </div>
</div>

<!-- Color selection overlay -->
<div class="select-overlay" id="select-overlay">
  <div class="select-modal" role="dialog" aria-modal="true" aria-labelledby="select-title">
    <div class="select-title" id="select-title">AI 대전 설정</div>
    <div class="select-sub" id="level-label">난이도</div>
    <div class="level-choices" role="radiogroup" aria-labelledby="level-label">
      <button type="button" class="level-chip" role="radio" data-level="easy" onclick="setLevel('easy')">쉬움</button>
      <button type="button" class="level-chip" role="radio" data-level="normal" onclick="setLevel('normal')">보통</button>
      <button type="button" class="level-chip" role="radio" data-level="hard" onclick="setLevel('hard')">어려움</button>
      <button type="button" class="level-chip" role="radio" data-level="boss" onclick="setLevel('boss')">æ 원준</button>
    </div>
    <div class="select-sub" id="tc-ai-label">시간 (내 차례만 계산)</div>
    <div class="level-choices" role="radiogroup" aria-labelledby="tc-ai-label" data-tc></div>
    <div class="select-sub">ZEST로 플레이할 돌을 선택하세요</div>
    <div class="stone-choices">
      <button type="button" class="stone-choice" onclick="selectColor(1)">
        <div class="stone-choice-img black" aria-hidden="true"></div>
        <div class="stone-choice-label">흑돌</div>
        <div class="stone-choice-tag" id="choice-black-tag">선공 · 흑돌</div>
      </button>
      <button type="button" class="stone-choice" onclick="selectColor(2)">
        <div class="stone-choice-img white" aria-hidden="true"></div>
        <div class="stone-choice-label">백돌</div>
        <div class="stone-choice-tag" id="choice-white-tag">후공 · 백돌</div>
      </button>
    </div>
  </div>
</div>

<!-- Win overlay -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-winner">
    <div class="modal-stone" id="modal-stone"></div>
    <div class="modal-title">승리</div>
    <div class="modal-winner" id="modal-winner"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-btns">
      <button class="btn" onclick="rematch()">다시 하기</button>
      <button class="btn secondary" onclick="closeOverlay()">닫기</button>
    </div>
  </div>
</div>

<div class="sr-only" id="sr-live" aria-live="polite" aria-atomic="true"></div>

<script src="ai.js"></script>
<script src="team.js"></script>
<script src="clock.js"></script>
<script src="room.js"></script>
<script src="app.js"></script>
</body>
</html>
