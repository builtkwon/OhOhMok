<style>
  :root {
    --board-color: #c8a96e;
    --board-dark: #a07840;
    --board-line: #7a5c30;
    --stone-black: #1a1a1a;
    --stone-white: #f5f0e8;
    --bg: #2b1f0e;
    --panel-bg: rgba(20, 13, 4, 0.75);
    --accent-gold: #d4a843;
    --accent-light: #f0d080;
    --text-primary: #f0dfa8;
    --text-secondary: #a09060;
    --cell-size: 40px;
    --stone-size: 34px;
    --board-size: 15;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
    --font-serif: 'AppleMyungjo', 'Batang', 'Noto Serif KR', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 12px;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(180,130,50,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 100%, rgba(100,60,10,0.2) 0%, transparent 50%);
    pointer-events: none;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: var(--font-serif);
    font-size: 2.8rem;
    font-weight: 800;
    color: var(--accent-gold);
    letter-spacing: 0.12em;
    text-shadow: 0 2px 20px rgba(212,168,67,0.4);
  }

  h1 span {
    font-size: 1rem;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.3em;
    display: block;
    margin-top: 2px;
  }

  .game-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    position: relative;
    z-index: 1;
  }

  /* Side panel */
  .panel {
    width: 200px;
    background: var(--panel-bg);
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 12px;
    padding: 20px 16px;
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .player-card {
    border-radius: 8px;
    padding: 14px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    border: 1px solid transparent;
  }

  .player-card.active {
    border-color: var(--accent-gold);
    background: rgba(212,168,67,0.08);
    box-shadow: 0 0 20px rgba(212,168,67,0.15);
  }

  .player-card.active::before {
    content: '▶';
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent-gold);
    font-size: 0.7rem;
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .player-stone {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
    position: relative;
    top: -1px;
  }

  .player-stone.black {
    background: radial-gradient(circle at 35% 30%, #555, #1a1a1a);
    box-shadow: 0 2px 6px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.15);
  }

  .player-stone.white {
    background: radial-gradient(circle at 35% 30%, #fff, #d8d0c0);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.8);
  }

  .player-name {
    font-family: var(--font-serif);
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .player-label {
    font-size: 0.72rem;
    color: var(--text-secondary);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(212,168,67,0.3), transparent);
  }

  .score-section {
    text-align: center;
  }

  .score-label {
    font-size: 0.7rem;
    color: var(--text-secondary);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .score-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .score-val {
    font-family: var(--font-serif);
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent-gold);
  }

  .score-separator {
    color: var(--text-secondary);
    font-size: 1rem;
  }

  .btn {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--accent-gold);
    background: transparent;
    color: var(--accent-gold);
    font-family: var(--font-serif);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn:hover {
    background: var(--accent-gold);
    color: var(--bg);
    box-shadow: 0 0 20px rgba(212,168,67,0.4);
  }

  .btn:active { transform: scale(0.97); }

  .btn.secondary {
    border-color: rgba(212,168,67,0.3);
    color: var(--text-secondary);
    font-size: 0.8rem;
  }

  .btn.secondary:hover {
    background: rgba(212,168,67,0.1);
    color: var(--text-primary);
    box-shadow: none;
  }

  /* Board container */
  .board-wrap {
    position: relative;
    padding: 24px;
    background: var(--panel-bg);
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 12px;
    backdrop-filter: blur(6px);
  }

  .board-surface {
    position: relative;
    background:
      linear-gradient(135deg, #d4aa6a 0%, #b8893e 30%, #c9a158 60%, #a07030 100%);
    border-radius: 4px;
    box-shadow:
      0 8px 40px rgba(0,0,0,0.6),
      inset 0 1px 3px rgba(255,255,255,0.2),
      inset 0 -2px 6px rgba(0,0,0,0.3);
  }

  /* Wood grain overlay */
  .board-surface::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px;
    background: repeating-linear-gradient(
      170deg,
      transparent,
      transparent 8px,
      rgba(0,0,0,0.025) 8px,
      rgba(0,0,0,0.025) 9px
    );
    pointer-events: none;
  }

  #board-canvas {
    display: block;
  }

  /* Stones overlay */
  .stones-layer {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }

  .stone {
    position: absolute;
    width: var(--stone-size);
    height: var(--stone-size);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.05s;
    animation: placeStone 0.18s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  @keyframes placeStone {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  .stone.black-stone {
    background-image: url(img/stone-black.jpg);
    background-size: cover;
    background-position: center top;
    box-shadow:
      0 3px 10px rgba(0,0,0,0.7),
      0 1px 3px rgba(0,0,0,0.9);
    border: 2px solid rgba(0,0,0,0.7);
  }

  .stone.white-stone {
    background-image: url(img/stone-white.jpg);
    background-size: cover;
    background-position: center top;
    box-shadow:
      0 3px 10px rgba(0,0,0,0.5),
      0 1px 3px rgba(0,0,0,0.7);
    border: 2px solid rgba(255,255,255,0.5);
  }

  .stone.winning {
    animation: winPulse 0.6s ease-in-out infinite alternate;
  }

  @keyframes winPulse {
    0% { box-shadow: 0 3px 10px rgba(0,0,0,0.7), 0 0 0 0 rgba(255,220,50,0.8); }
    100% { box-shadow: 0 3px 10px rgba(0,0,0,0.7), 0 0 0 8px rgba(255,220,50,0); }
  }

  .stone.last-placed::after {
    content: '';
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: rgba(255,100,50,0.8);
  }

  /* Hover ghost stone */
  .ghost-stone {
    position: absolute;
    width: var(--stone-size);
    height: var(--stone-size);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0.35;
    transition: left 0.05s, top 0.05s;
    display: none;
  }

  .ghost-stone.black-ghost {
    background-image: url(img/stone-black.jpg);
    background-size: cover;
    background-position: center top;
    border: 2px solid rgba(0,0,0,0.5);
  }

  .ghost-stone.white-ghost {
    background-image: url(img/stone-white.jpg);
    background-size: cover;
    background-position: center top;
    border: 2px solid rgba(220,220,220,0.5);
  }

  /* Overlay modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,5,0,0.75);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: linear-gradient(160deg, #2a1c0a, #1a1005);
    border: 1px solid var(--accent-gold);
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212,168,67,0.15);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  .overlay.show .modal {
    transform: scale(1);
  }

  .modal-stone {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: winBounce 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes winBounce {
    0% { transform: scale(0) rotate(-30deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .modal-stone.black-stone {
    background-image: url(img/stone-black.jpg);
    background-size: cover;
    background-position: center top;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 30px rgba(255,220,50,0.4);
    border: 2px solid rgba(0,0,0,0.5);
  }

  .modal-stone.white-stone {
    background-image: url(img/stone-white.jpg);
    background-size: cover;
    background-position: center top;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 30px rgba(255,220,50,0.4);
    border: 2px solid rgba(220,220,220,0.6);
  }

  .modal-title {
    font-family: var(--font-serif);
    font-size: 1.1rem;
    color: var(--text-secondary);
    letter-spacing: 0.2em;
    margin-bottom: 4px;
  }

  .modal-winner {
    font-family: var(--font-serif);
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent-gold);
    margin-bottom: 8px;
    text-shadow: 0 2px 20px rgba(212,168,67,0.5);
  }

  .modal-sub {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .modal-btns .btn {
    width: auto;
    padding: 10px 24px;
  }

  /* Turn indicator */
  .turn-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    letter-spacing: 0.1em;
  }

  .turn-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    transition: background 0.3s;
  }

  /* Clickable board area */
  .board-click {
    position: absolute;
    top: 0; left: 0;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Color selection overlay */
  .select-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,5,0,0.85);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .select-overlay.show { opacity: 1; pointer-events: all; }
  .select-modal {
    background: linear-gradient(160deg, #2a1c0a, #1a1005);
    border: 1px solid var(--accent-gold);
    border-radius: 16px;
    padding: 36px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212,168,67,0.15);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 320px;
  }
  .select-overlay.show .select-modal { transform: scale(1); }
  .select-title {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--accent-gold);
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }
  .select-sub {
    font-size: 0.8rem;
    color: var(--text-secondary);
    letter-spacing: 0.12em;
    margin-bottom: 28px;
  }
  .stone-choices { display: flex; gap: 20px; justify-content: center; margin-bottom: 8px; }
  .stone-choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 18px 24px;
    border-radius: 12px;
    border: 2px solid transparent;
    transition: all 0.2s ease;
    background: rgba(255,255,255,0.03);
  }
  .stone-choice:hover {
    border-color: var(--accent-gold);
    background: rgba(212,168,67,0.08);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(212,168,67,0.15);
  }
  .stone-choice-img {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    border: 3px solid rgba(212,168,67,0.4);
    transition: all 0.2s;
  }
  .stone-choice:hover .stone-choice-img {
    border-color: var(--accent-gold);
    box-shadow: 0 4px 24px rgba(212,168,67,0.4);
  }
  .stone-choice-label { font-family: var(--font-serif); font-size: 0.95rem; font-weight: 700; color: var(--text-primary); letter-spacing: 0.08em; }
  .stone-choice-tag { font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 0.1em; }
  .ai-thinking {
    display: none; align-items: center; gap: 6px;
    justify-content: center; margin-top: 8px;
    font-size: 0.78rem; color: var(--accent-gold); letter-spacing: 0.1em;
  }
  .ai-thinking.show { display: flex; }
  .ai-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent-gold);
    animation: aiPulse 1.2s ease-in-out infinite;
  }
  .ai-dot:nth-child(2) { animation-delay: 0.2s; }
  .ai-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes aiPulse {
    0%, 60%, 100% { transform: scale(1); opacity: 0.4; }
    30% { transform: scale(1.4); opacity: 1; }
  }
  .player-badge {
    display: inline-block; font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.12em; padding: 2px 6px; border-radius: 4px;
    margin-left: 4px; vertical-align: middle;
  }
  .badge-human { background: rgba(212,168,67,0.2); color: var(--accent-gold); border: 1px solid rgba(212,168,67,0.4); }
  .badge-ai { background: rgba(100,180,255,0.15); color: #6ab4ff; border: 1px solid rgba(100,180,255,0.3); }

  /* Mode selection overlay */
  .mode-overlay {
    position: fixed; inset: 0;
    background: rgba(10,5,0,0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .mode-overlay.show { opacity: 1; pointer-events: all; }
  .mode-modal {
    background: linear-gradient(160deg, #2a1c0a, #1a1005);
    border: 1px solid var(--accent-gold);
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212,168,67,0.15);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 340px;
  }
  .mode-overlay.show .mode-modal { transform: scale(1); }
  .mode-title {
    font-family: var(--font-serif);
    font-size: 1.8rem; font-weight: 800;
    color: var(--accent-gold); margin-bottom: 4px; letter-spacing: 0.08em;
  }
  .mode-subtitle { font-size: 0.78rem; color: var(--text-secondary); letter-spacing: 0.15em; margin-bottom: 32px; }
  .mode-cards { display: flex; gap: 16px; justify-content: center; }
  .mode-card {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    cursor: pointer; padding: 20px 20px; border-radius: 12px;
    border: 2px solid rgba(212,168,67,0.2);
    background: rgba(255,255,255,0.03);
    transition: all 0.2s ease; width: 130px;
  }
  .mode-card:hover {
    border-color: var(--accent-gold);
    background: rgba(212,168,67,0.08);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(212,168,67,0.2);
  }
  .mode-icon { font-size: 2.4rem; line-height: 1; }
  .mode-card-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; color: var(--text-primary); }
  .mode-card-desc { font-size: 0.68rem; color: var(--text-secondary); letter-spacing: 0.08em; line-height: 1.4; text-align: center; }

  /* Room overlay */
  .room-overlay {
    position: fixed; inset: 0;
    background: rgba(10,5,0,0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .room-overlay.show { opacity: 1; pointer-events: all; }
  .room-modal {
    background: linear-gradient(160deg, #2a1c0a, #1a1005);
    border: 1px solid var(--accent-gold);
    border-radius: 16px; padding: 36px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212,168,67,0.15);
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    min-width: 320px;
  }
  .room-overlay.show .room-modal { transform: scale(1); }
  .room-title { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 800; color: var(--accent-gold); margin-bottom: 6px; }
  .room-subtitle { font-size: 0.78rem; color: var(--text-secondary); letter-spacing: 0.1em; margin-bottom: 24px; }
  .room-tabs { display: flex; gap: 0; margin-bottom: 24px; border: 1px solid rgba(212,168,67,0.3); border-radius: 8px; overflow: hidden; }
  .room-tab {
    flex: 1; padding: 10px; font-family: var(--font-serif); font-size: 0.9rem; font-weight: 700;
    background: transparent; border: none; color: var(--text-secondary); cursor: pointer;
    transition: all 0.2s;
  }
  .room-tab.active { background: rgba(212,168,67,0.15); color: var(--accent-gold); }
  .room-panel { display: none; }
  .room-panel.active { display: block; }
  .room-code-box {
    background: rgba(0,0,0,0.4);
    border: 2px solid var(--accent-gold);
    border-radius: 10px; padding: 16px 24px;
    font-family: var(--font-serif); font-size: 2.4rem;
    font-weight: 800; color: var(--accent-gold);
    letter-spacing: 0.25em; text-align: center;
    margin-bottom: 10px; cursor: pointer;
    transition: all 0.2s;
  }
  .room-code-box:hover { background: rgba(212,168,67,0.08); }
  .room-code-hint { font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 20px; }
  .room-code-hint span { color: var(--accent-gold); }
  .room-waiting { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 0.8rem; color: var(--text-secondary); margin-top: 8px; }
  .room-input {
    width: 100%; padding: 12px 16px; margin-bottom: 16px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(212,168,67,0.4);
    border-radius: 8px; color: var(--text-primary);
    font-family: var(--font-serif); font-size: 1.6rem;
    font-weight: 800; letter-spacing: 0.3em; text-align: center;

    transition: border-color 0.2s;
  }
  .room-input:focus { border-color: var(--accent-gold); }
  .room-input::placeholder { color: rgba(160,144,96,0.4); font-size: 1.2rem; letter-spacing: 0.1em; }
  .room-status { font-size: 0.78rem; margin-bottom: 12px; min-height: 20px; }
  .room-status.ok { color: #6dcc8a; }
  .room-status.err { color: #ff7070; }
  .back-btn { font-size: 0.75rem; color: var(--text-secondary); background: none; border: none; cursor: pointer; margin-top: 12px; text-decoration: underline; }
  .back-btn:hover { color: var(--text-primary); }
  /* Online game badge */
  .online-badge {
    display: inline-block; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em;
    padding: 2px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle;
    background: rgba(100,220,120,0.15); color: #6dcc8a; border: 1px solid rgba(100,220,120,0.3);
  }
  .conn-status {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.7rem; justify-content: center; margin-top: 6px;
  }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #6dcc8a; animation: connPulse 2s ease-in-out infinite; }
  .conn-dot.offline { background: #ff7070; animation: none; }
  @keyframes connPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* a11y helpers */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button.mode-card, button.stone-choice, button.room-code-box, .level-chip { font: inherit; color: inherit; }
  button:focus-visible, .level-chip:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }
  .board-surface:focus-within { outline: 2px solid var(--accent-gold); outline-offset: 3px; }
  .board-click:focus { outline: none; }
  .kb-cursor { position: absolute; width: var(--stone-size); height: var(--stone-size); border: 2px dashed var(--accent-light); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; }
  /* hidden overlays must not be focusable */
  .overlay, .select-overlay, .mode-overlay, .room-overlay { visibility: hidden; transition: opacity 0.4s ease, visibility 0s linear 0.4s; }
  .overlay.show, .select-overlay.show, .mode-overlay.show, .room-overlay.show { visibility: visible; transition: opacity 0.4s ease, visibility 0s; }
  /* difficulty chips */
  .level-choices { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .level-chip { padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(212,168,67,0.3); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.85rem; transition: all 0.2s ease; }
  .level-chip:hover { color: var(--text-primary); }
  .level-chip[aria-checked="true"] { background: rgba(212,168,67,0.2); border-color: var(--accent-gold); color: var(--accent-gold); font-weight: 700; }

  /* `transition: all` on children would animate inherited visibility and block focus for 0.2s */
  .overlay *, .select-overlay *, .mode-overlay *, .room-overlay * { transition-property: background, color, border-color, box-shadow, transform, opacity; }

  /* Mobile / narrow: stack layout, drop mirror panel */
  @media (max-width: 900px) {
    body { justify-content: flex-start; }
    h1 { font-size: 2rem; }
    header { margin-bottom: 10px; }
    .game-layout { flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .panel { width: 100%; max-width: 480px; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; }
    .panel:last-child { display: none; }

    .mode-cards, .stone-choices { gap: 10px; }
    .mode-card { width: 120px; padding: 14px 10px; }
    .stone-choice { padding: 12px 14px; }
  }
</style>

<script>
const BOARD_SIZE = 15;
const CELL = 40;
const MARGIN = 28;
const STONE_R = 17;
const CANVAS_SIZE = (BOARD_SIZE - 1) * CELL + MARGIN * 2;

let board = [];
let currentPlayer = 1;
let gameOver = false;
let scores = {1: 0, 2: 0};
let lastPlaced = null;
let winningCells = [];
let humanPlayer = 1;
let aiPlayer = 2;
let aiThinking = false;

// Game mode: 'ai' | 'online'
let gameMode = 'ai';
// Online: 'host' | 'guest'
let onlineRole = null;
let peer = null;
let conn = null;
let myOnlinePlayer = 1; // in online mode

const stoneImgs = {};
(function() {
  const tmpDiv = document.createElement('div');
  tmpDiv.className = 'stone black-stone';
  tmpDiv.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px';
  document.body.appendChild(tmpDiv);
  const blackBg = getComputedStyle(tmpDiv).backgroundImage;
  tmpDiv.className = 'stone white-stone';
  const whiteBg = getComputedStyle(tmpDiv).backgroundImage;
  document.body.removeChild(tmpDiv);
  function extractUrl(bg) { return bg.replace(/^url\(["']?/, '').replace(/["']?\)$/, ''); }
  stoneImgs[1] = extractUrl(blackBg);
  stoneImgs[2] = extractUrl(whiteBg);
  document.getElementById('choice-black-img').src = stoneImgs[1];
  document.getElementById('choice-white-img').src = stoneImgs[2];
})();

const canvas = document.getElementById('board-canvas');
const clickCanvas = document.getElementById('board-click');
const stonesLayer = document.getElementById('stones-layer');
const ghost = document.getElementById('ghost-stone');

canvas.width = clickCanvas.width = CANVAS_SIZE;
canvas.height = clickCanvas.height = CANVAS_SIZE;
document.getElementById('board-surface').style.width = CANVAS_SIZE + 'px';
document.getElementById('board-surface').style.height = CANVAS_SIZE + 'px';
stonesLayer.style.width = CANVAS_SIZE + 'px';
stonesLayer.style.height = CANVAS_SIZE + 'px';
ghost.style.width = ghost.style.height = STONE_R * 2 + 'px';
clickCanvas.style.width = clickCanvas.style.height = CANVAS_SIZE + 'px';
clickCanvas.style.position = 'absolute';
clickCanvas.style.top = '0'; clickCanvas.style.left = '0';
clickCanvas.style.opacity = '0';

// ─── MODE SELECTION ───────────────────────────────────────────
function selectMode(mode) {
  gameMode = mode;
  hideOverlay('mode-overlay');
  if (mode === 'ai') {
    showOverlay('select-overlay');
  } else {
    showOverlay('room-overlay');
    initRoomOverlay();
  }
}

function backToModeSelect() {
  destroyPeer();
  hideOverlay('room-overlay');
  showOverlay('mode-overlay');
}

const OVERLAYS = '.overlay.show,.select-overlay.show,.mode-overlay.show,.room-overlay.show';
let lastFocus = null;
function syncInert() {
  const open = document.querySelectorAll(OVERLAYS).length > 0;
  document.querySelector('header').inert = open;
  document.querySelector('.game-layout').inert = open;
}
function showOverlay(id) {
  const el = document.getElementById(id);
  if (!document.querySelector(OVERLAYS)) lastFocus = document.activeElement;
  el.classList.add('show');
  syncInert();
  setTimeout(() => { const f = el.querySelector('button, input'); if (f) f.focus(); }, 0);
}
function hideOverlay(id) {
  document.getElementById(id).classList.remove('show');
  syncInert();
  if (!document.querySelector(OVERLAYS) && lastFocus && lastFocus.focus) { lastFocus.focus(); lastFocus = null; }
}
function announce(msg) { document.getElementById('sr-live').textContent = msg; }
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const on = (id) => document.getElementById(id).classList.contains('show');
  if (on('overlay')) closeOverlay();
  else if (on('room-overlay')) backToModeSelect();
  else if (on('select-overlay')) { hideOverlay('select-overlay'); showOverlay('mode-overlay'); }
});

// AI difficulty
const LEVEL_NAMES = {easy: '쉬움', normal: '보통', hard: '어려움'};
let aiLevel = 'normal';
try { const v = localStorage.getItem('zestmok-level'); if (LEVEL_NAMES[v]) aiLevel = v; } catch (e) {}
function levelName() { return LEVEL_NAMES[aiLevel]; }
function setLevel(l) {
  aiLevel = l;
  try { localStorage.setItem('zestmok-level', l); } catch (e) {}
  document.querySelectorAll('.level-chip').forEach(b => b.setAttribute('aria-checked', b.dataset.level === l));
}
setLevel(aiLevel);

// ─── ROOM SYSTEM ──────────────────────────────────────────────
// ICE: STUN only by default. For strict NAT / mobile networks add a TURN entry below.
const ICE_SERVERS = [
  {urls: 'stun:stun.l.google.com:19302'},
  {urls: 'stun:global.stun.twilio.com:3478'},
  // {urls: 'turn:YOUR_TURN_HOST:443?transport=tcp', username: 'USER', credential: 'PASS'},
];
const PEER_OPTS = {debug: 0, config: {iceServers: ICE_SERVERS}};
const PEER_PREFIX = 'zestmok-';
const CODE_LEN = 6;
const HEARTBEAT_MS = 5000, DEAD_MS = 15000, GRACE_MS = 30000, REJOIN_MS = 3000;

let roomCode = '', createTries = 0;
let onlineStarted = false, peerLost = false;
let lastSeen = 0, hbTimer = null, graceTimer = null, rejoinTimer = null;
let restartPending = false, incomingRestart = false;
let joinResolve = null; // guest: set while waiting for host's 'welcome'

function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const buf = crypto.getRandomValues(new Uint8Array(CODE_LEN));
  return Array.from(buf, b => chars[b % chars.length]).join('');
}

function errText(err) {
  const t = err && err.type;
  if (t === 'peer-unavailable') return '방을 찾을 수 없습니다. 코드를 확인하세요.';
  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return '서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.';
  if (t === 'webrtc') return '연결 설정에 실패했습니다. 네트워크 환경을 확인하세요.';
  if (err === 'timeout') return '연결 시간이 초과되었습니다.';
  return '연결 오류가 발생했습니다.';
}

// Pure check for a move received from the opponent.
function isValidMove(msg, b, turn, expected, over) {
  return !over && turn === expected && !!msg &&
    Number.isInteger(msg.row) && Number.isInteger(msg.col) &&
    msg.row >= 0 && msg.row < BOARD_SIZE && msg.col >= 0 && msg.col < BOARD_SIZE &&
    b[msg.row][msg.col] === 0;
}

function isValidSync(m) {
  return m && (m.currentPlayer === 1 || m.currentPlayer === 2) && Array.isArray(m.board) &&
    m.board.length === BOARD_SIZE &&
    m.board.every(r => Array.isArray(r) && r.length === BOARD_SIZE && r.every(v => v === 0 || v === 1 || v === 2));
}

function switchTab(tab) {
  document.getElementById('tab-create').classList.toggle('active', tab === 'create');
  document.getElementById('tab-join').classList.toggle('active', tab === 'join');
  document.getElementById('panel-create').classList.toggle('active', tab === 'create');
  document.getElementById('panel-join').classList.toggle('active', tab === 'join');
  if (tab === 'create') { createTries = 0; initCreateRoom(); }
  else destroyPeer();
}

function initRoomOverlay() {
  switchTab('create');
}

function setCreateStatus(msg) { document.getElementById('create-status-text').textContent = msg; }

function initCreateRoom() {
  destroyPeer();
  roomCode = generateCode();
  document.getElementById('room-code-display').textContent = roomCode;
  setCreateStatus('상대방을 기다리는 중...');
  const p = peer = new Peer(PEER_PREFIX + roomCode, PEER_OPTS);
  p.on('connection', onHostConnection);
  p.on('disconnected', () => { try { if (peer === p && !p.destroyed) p.reconnect(); } catch (e) {} });
  p.on('error', (err) => {
    if (peer !== p) return;
    if (err.type === 'unavailable-id' && !onlineStarted && createTries++ < 5) return initCreateRoom();
    if (!onlineStarted) setCreateStatus('오류: ' + errText(err));
  });
}

function connAlive() {
  return !!conn && conn.open && !peerLost && Date.now() - lastSeen < DEAD_MS;
}

function onHostConnection(c) {
  if (connAlive()) { // room full
    c.on('open', () => { try { c.send({type: 'full'}); } catch (e) {} setTimeout(() => c.close(), 300); });
    return;
  }
  if (conn) { const old = conn; conn = null; try { old.close(); } catch (e) {} }
  conn = c;
  setupConn(c);
  c.on('open', () => {
    if (conn !== c) return;
    onlineRole = 'host';
    myOnlinePlayer = 1;
    send({type: 'welcome'});
    if (onlineStarted) { sendSync(); resumeOnline(); return; } // guest rejoined
    setCreateStatus('상대방이 연결되었습니다!');
    setTimeout(() => {
      if (conn !== c) return;
      hideOverlay('room-overlay');
      startOnlineGame();
    }, 800);
  });
}

// Connect to a host room. onOpen/onFail each fire at most once.
function guestConnect(code, onOpen, onFail) {
  let done = false;
  const fail = (e) => { if (!done) { done = true; clearTimeout(t); onFail(e); } };
  const p = peer = new Peer(undefined, PEER_OPTS);
  const t = setTimeout(() => fail('timeout'), 12000);
  p.on('open', () => {
    const c = p.connect(PEER_PREFIX + code, {reliable: true});
    c.on('open', () => {
      if (done || peer !== p) return;
      done = true; clearTimeout(t);
      conn = c; setupConn(c); onOpen();
    });
    c.on('error', fail);
  });
  p.on('error', fail);
}

function joinRoom() {
  const code = document.getElementById('join-code-input').value.trim().toUpperCase();
  if (code.length !== CODE_LEN) {
    setJoinStatus(CODE_LEN + '자리 코드를 입력하세요', 'err');
    return;
  }
  setJoinStatus('연결 중...', '');
  destroyPeer();
  roomCode = code;
  guestConnect(code, () => {
    const t = setTimeout(() => { joinResolve = null; destroyPeer(); setJoinStatus('방이 응답하지 않습니다.', 'err'); }, 5000);
    joinResolve = () => {
      clearTimeout(t); joinResolve = null;
      onlineRole = 'guest';
      myOnlinePlayer = 2;
      setJoinStatus('연결 성공!', 'ok');
      setTimeout(() => {
        hideOverlay('room-overlay');
        startOnlineGame();
      }, 500);
    };
  }, (err) => { destroyPeer(); setJoinStatus(errText(err), 'err'); });
}

function setupConn(c) {
  lastSeen = Date.now();
  c.on('data', (d) => { if (c !== conn) return; lastSeen = Date.now(); onReceiveData(d); });
  c.on('close', () => { if (c === conn) onPeerLost(); });
  c.on('error', () => { if (c === conn) onPeerLost(); });
}

function send(msg) { if (conn && conn.open) { try { conn.send(msg); } catch (e) {} } }

function onReceiveData(data) {
  if (!data || typeof data.type !== 'string') return;
  if (!onlineStarted) {
    if (data.type === 'welcome' && joinResolve) joinResolve();
    else if (data.type === 'full') { destroyPeer(); setJoinStatus('방이 가득 찼습니다.', 'err'); }
    return;
  }
  switch (data.type) {
    case 'ping': break;
    case 'move':
      if (isValidMove(data, board, currentPlayer, 3 - myOnlinePlayer, gameOver)) {
        doPlaceStone(data.row, data.col, false);
      } else if (onlineRole === 'host') sendSync();
      else send({type: 'need-sync'});
      break;
    case 'need-sync': if (onlineRole === 'host') sendSync(); break;
    case 'sync': if (onlineRole === 'guest') applySync(data); break;
    case 'restart-req':
      if (restartPending) { send({type: 'restart-ack'}); doNewOnlineGame(); }
      else { incomingRestart = true; showEndOverlay('다시 하기 요청', '상대가 한 판 더 하자고 합니다. 버튼을 눌러 수락하세요.'); }
      break;
    case 'restart-ack': if (restartPending) doNewOnlineGame(); break;
  }
}

function sendMove(row, col) { send({type: 'move', row, col}); }

function sendSync() {
  send({type: 'sync', board, currentPlayer, gameOver, lastPlaced, winningCells});
}

function applySync(m) {
  if (!isValidSync(m)) return;
  board = m.board; currentPlayer = m.currentPlayer; gameOver = !!m.gameOver;
  lastPlaced = m.lastPlaced || null; winningCells = Array.isArray(m.winningCells) ? m.winningCells : [];
  refreshStones(); updateTurn();
  resumeOnline();
}

// "다시 하기" in online mode: both sides must agree.
function onlineRematch() {
  if (incomingRestart) { send({type: 'restart-ack'}); doNewOnlineGame(); return; }
  if (!connAlive()) { showEndOverlay('연결 끊김', '상대와 연결되어 있지 않습니다.'); return; }
  restartPending = true;
  send({type: 'restart-req'});
  document.getElementById('modal-sub').textContent = '상대의 수락을 기다리는 중...';
}

function copyRoomCode() {
  const code = document.getElementById('room-code-display').textContent;
  if (code === '----' || code.length !== CODE_LEN) return;
  navigator.clipboard.writeText(code).then(() => {
    const el = document.getElementById('room-code-display');
    const orig = el.textContent;
    el.textContent = '복사됨!';
    setTimeout(() => el.textContent = orig, 1200);
  }).catch(() => {});
}

function setJoinStatus(msg, type) {
  const el = document.getElementById('join-status');
  el.textContent = msg;
  el.className = 'room-status' + (type ? ' ' + type : '');
}

function setConnStatus(online, text) {
  const s = document.getElementById('conn-status');
  const d = document.getElementById('conn-dot');
  const t = document.getElementById('conn-text');
  s.style.display = 'flex';
  d.className = 'conn-dot' + (online ? '' : ' offline');
  t.textContent = text || (online ? '연결됨' : '상대방 연결 끊김');
}

// ── connection health: heartbeat, grace period, guest auto-rejoin ──
function startHeartbeat() {
  clearInterval(hbTimer);
  hbTimer = setInterval(() => {
    send({type: 'ping'});
    if (!peerLost && Date.now() - lastSeen > DEAD_MS) onPeerLost();
  }, HEARTBEAT_MS);
}

function onPeerLost() {
  if (!onlineStarted) { // guest left before the game began
    if (onlineRole === 'host' && conn) { conn = null; setCreateStatus('상대방을 기다리는 중...'); }
    return;
  }
  if (peerLost) return;
  peerLost = true;
  if (gameOver) { setConnStatus(false); return; }
  setConnStatus(false, '상대방 연결 끊김 — 재접속 대기 중');
  clearTimeout(graceTimer);
  graceTimer = setTimeout(abandonOnline, GRACE_MS);
  if (onlineRole === 'guest') startRejoin();
}

function resumeOnline() {
  peerLost = false;
  lastSeen = Date.now();
  clearTimeout(graceTimer); clearInterval(rejoinTimer);
  setConnStatus(true);
}

function startRejoin() {
  clearInterval(rejoinTimer);
  let busy = false;
  rejoinTimer = setInterval(() => {
    if (busy || !peerLost) return;
    busy = true;
    closeLink();
    guestConnect(roomCode, () => { busy = false; send({type: 'need-sync'}); }, () => { busy = false; });
  }, REJOIN_MS);
}

function abandonOnline() {
  clearInterval(rejoinTimer);
  gameOver = true;
  setConnStatus(false, '연결 종료');
  showEndOverlay('대국 종료', '상대와 연결이 끊겨 대국이 종료되었습니다. (무효)');
}

function closeLink() {
  if (conn) { const c = conn; conn = null; try { c.close(); } catch (e) {} }
  if (peer) { const p = peer; peer = null; try { p.destroy(); } catch (e) {} }
}

function destroyPeer() {
  clearInterval(hbTimer); clearInterval(rejoinTimer); clearTimeout(graceTimer);
  onlineStarted = false; peerLost = false; restartPending = false; incomingRestart = false; joinResolve = null;
  closeLink();
}


function startOnlineGame() {
  // host=black(1), guest=white(2)
  humanPlayer = myOnlinePlayer;
  aiPlayer = myOnlinePlayer === 1 ? 2 : 1;
  onlineStarted = true; peerLost = false; restartPending = incomingRestart = false;
  setConnStatus(true);
  startHeartbeat();
  updateOnlineBadges();
  document.getElementById('conn-status').style.display = 'flex';
  gameOver = false;
  currentPlayer = 1;
  initBoard();
  updateTurn();
  setAiThinking(false);
}

function updateOnlineBadges() {
  const nBlack = document.getElementById('name-black');
  const nWhite = document.getElementById('name-white');
  const lBlack = document.getElementById('label-black');
  const lWhite = document.getElementById('label-white');
  if (myOnlinePlayer === 1) {
    nBlack.innerHTML = 'ZEST <span class="player-badge badge-human" id="badge-black">나</span>';
    nWhite.innerHTML = 'ZAIST <span class="player-badge online-badge" id="badge-white">상대</span>';
  } else {
    nBlack.innerHTML = 'ZAIST <span class="player-badge online-badge" id="badge-black">상대</span>';
    nWhite.innerHTML = 'ZEST <span class="player-badge badge-human" id="badge-white">나</span>';
  }
  lBlack.textContent = '흑돌 · 선공';
  lWhite.textContent = '백돌 · 후공';
}

// ─── COLOR SELECTION (AI MODE) ────────────────────────────────
function selectColor(color) {
  humanPlayer = color;
  aiPlayer = color === 1 ? 2 : 1;
  hideOverlay('select-overlay');
  updateBadges();
  gameOver = false;
  aiThinking = false;
  currentPlayer = 1;
  document.getElementById('conn-status').style.display = 'none';
  initBoard();
  updateTurn();
  setAiThinking(false);
  if (humanPlayer === 2) setTimeout(doAiMove, 400);
}

function updateBadges() {
  const nBlack = document.getElementById('name-black');
  const nWhite = document.getElementById('name-white');
  const lBlack = document.getElementById('label-black');
  const lWhite = document.getElementById('label-white');
  if (humanPlayer === 1) {
    nBlack.innerHTML = 'ZEST <span class="player-badge badge-human" id="badge-black">나</span>';
    nWhite.innerHTML = 'ZAIST <span class="player-badge badge-ai" id="badge-white">AI · '+levelName()+'</span>';
  } else {
    nBlack.innerHTML = 'ZAIST <span class="player-badge badge-ai" id="badge-black">AI · '+levelName()+'</span>';
    nWhite.innerHTML = 'ZEST <span class="player-badge badge-human" id="badge-white">나</span>';
  }
  lBlack.textContent = '흑돌 · 선공';
  lWhite.textContent = '백돌 · 후공';
}

// ─── BOARD ────────────────────────────────────────────────────
function initBoard() {
  board = Array.from({length: BOARD_SIZE}, () => Array(BOARD_SIZE).fill(0));
  lastPlaced = null; winningCells = [];
  stonesLayer.innerHTML = '';
  stonesLayer.appendChild(ghost);
  drawBoard();
}

function drawBoard() {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  ctx.strokeStyle = '#7a5c30'; ctx.lineWidth = 1;
  for (let i = 0; i < BOARD_SIZE; i++) {
    const x = MARGIN+i*CELL, y = MARGIN+i*CELL;
    ctx.beginPath(); ctx.moveTo(x, MARGIN); ctx.lineTo(x, MARGIN+(BOARD_SIZE-1)*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(MARGIN, y); ctx.lineTo(MARGIN+(BOARD_SIZE-1)*CELL, y); ctx.stroke();
  }
  const stars = [[3,3],[3,11],[7,7],[11,3],[11,11]];
  ctx.fillStyle = '#5c3f18';
  for (const [r,c] of stars) { ctx.beginPath(); ctx.arc(MARGIN+c*CELL, MARGIN+r*CELL, 4, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = 'rgba(90,60,20,0.7)';
  ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'center';
  const cols = 'ABCDEFGHJKLMNOP';
  for (let i = 0; i < BOARD_SIZE; i++) {
    ctx.fillText(cols[i], MARGIN+i*CELL, 14);
    ctx.fillText(cols[i], MARGIN+i*CELL, CANVAS_SIZE-6);
    ctx.textAlign='right'; ctx.fillText(BOARD_SIZE-i, MARGIN-8, MARGIN+i*CELL+4);
    ctx.textAlign='left'; ctx.fillText(BOARD_SIZE-i, MARGIN+(BOARD_SIZE-1)*CELL+10, MARGIN+i*CELL+4);
    ctx.textAlign='center';
  }
}

function colRowFromXY(x, y) {
  const col = Math.round((x-MARGIN)/CELL), row = Math.round((y-MARGIN)/CELL);
  if (col<0||col>=BOARD_SIZE||row<0||row>=BOARD_SIZE) return null;
  const cx=MARGIN+col*CELL, cy=MARGIN+row*CELL;
  if (Math.abs(x-cx)>CELL*0.5||Math.abs(y-cy)>CELL*0.5) return null;
  return {row, col};
}

function addStoneElement(row, col, player, isLast, isWin) {
  const el = document.createElement('div');
  el.className = `stone ${player===1?'black-stone':'white-stone'}`;
  el.style.left = (MARGIN+col*CELL)+'px'; el.style.top = (MARGIN+row*CELL)+'px';
  el.dataset.row = row; el.dataset.col = col;
  if (isLast) el.classList.add('last-placed');
  if (isWin) el.classList.add('winning');
  stonesLayer.appendChild(el);
  return el;
}

function refreshStones() {
  stonesLayer.innerHTML = ''; stonesLayer.appendChild(ghost);
  for (let r=0;r<BOARD_SIZE;r++) for (let c=0;c<BOARD_SIZE;c++) if (board[r][c]) {
    const isLast = lastPlaced && lastPlaced.row===r && lastPlaced.col===c;
    const isWin = winningCells.some(([wr,wc])=>wr===r&&wc===c);
    addStoneElement(r, c, board[r][c], isLast, isWin);
  }
}

// ─── PLACING STONES ───────────────────────────────────────────
function handleClick(row, col) {
  if (gameOver || aiThinking) return;
  if (gameMode === 'ai') {
    if (currentPlayer !== humanPlayer) return;
    doPlaceStone(row, col, true);
    if (!gameOver) setTimeout(doAiMove, 350);
  } else {
    // online
    if (currentPlayer !== myOnlinePlayer) return;
    sendMove(row, col);
    doPlaceStone(row, col, false);
  }
}

const COL_NAMES = 'ABCDEFGHJKLMNOP';
function coordName(r, c) { return COL_NAMES[c] + (BOARD_SIZE - r); }

function doPlaceStone(row, col, triggerAi) {
  if (gameOver || board[row][col] !== 0) return;
  board[row][col] = currentPlayer;
  document.querySelectorAll('.stone.last-placed').forEach(e=>e.classList.remove('last-placed'));
  lastPlaced = {row, col};
  announce((currentPlayer===1?'흑돌 ':'백돌 ')+coordName(row,col)+' 착수');
  const isWin = checkWin(row, col);
  addStoneElement(row, col, currentPlayer, true, false);
  if (isWin) {
    winningCells = isWin;
    gameOver = true;
    scores[currentPlayer]++;
    updateScores();
    setTimeout(refreshStones, 50);
    setTimeout(()=>showWinOverlay(currentPlayer), 500);
    return;
  }
  if (board.flat().every(v=>v!==0)) {
    gameOver = true;
    setTimeout(()=>showDrawOverlay(), 300);
    return;
  }
  currentPlayer = currentPlayer===1?2:1;
  updateTurn();
}

// ─── AI ───────────────────────────────────────────────────────
function doAiMove() {
  if (gameOver || currentPlayer !== aiPlayer || gameMode !== 'ai') return;
  aiThinking = true; setAiThinking(true);
  setTimeout(()=>{
    const move = GomokuAI.bestMove(board, aiPlayer, aiLevel);
    aiThinking = false; setAiThinking(false);
    if (move) doPlaceStone(move.row, move.col, false);
  }, 80);
}

function setAiThinking(on) {
  document.getElementById('ai-thinking').classList.toggle('show', on);
  clickCanvas.style.pointerEvents = on ? 'none' : 'auto';
}

// ─── WIN CHECK ────────────────────────────────────────────────
function checkWin(row,col){
  const p=board[row][col];
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    const cells=[[row,col]];
    for(let d=1;d<5;d++){const r=row+dr*d,c=col+dc*d;if(r<0||r>=BOARD_SIZE||c<0||c>=BOARD_SIZE||board[r][c]!==p)break;cells.push([r,c]);}
    for(let d=1;d<5;d++){const r=row-dr*d,c=col-dc*d;if(r<0||r>=BOARD_SIZE||c<0||c>=BOARD_SIZE||board[r][c]!==p)break;cells.push([r,c]);}
    if(cells.length>=5)return cells;
  }
  return null;
}

// ─── UI UPDATES ───────────────────────────────────────────────
function updateTurn(){
  const dot=document.getElementById('turn-dot');
  const text=document.getElementById('turn-text');
  dot.style.background=currentPlayer===1?'#222':'#e8e0d0';
  dot.style.border=currentPlayer===2?'1px solid #999':'none';
  dot.style.boxShadow=currentPlayer===1?'0 0 6px rgba(0,0,0,0.8)':'0 0 6px rgba(255,255,255,0.6)';
  if(gameMode==='ai'){
    const isAiTurn=currentPlayer===aiPlayer;
    const name=currentPlayer===humanPlayer?'ZEST':'ZAIST';
    text.textContent=isAiTurn?`${name} (AI) 차례`:`${name} 차례`;
  } else {
    const isMyTurn=currentPlayer===myOnlinePlayer;
    const name=isMyTurn?'ZEST':'ZAIST';
    text.textContent=isMyTurn?`${name} (나) 차례`:`${name} 차례`;
  }
  if(document.activeElement===clickCanvas)kbShow();
  document.getElementById('card-black').classList.toggle('active',currentPlayer===1);
  document.getElementById('card-white').classList.toggle('active',currentPlayer===2);
}

function updateScores(){
  document.getElementById('score-black').textContent=scores[1];
  document.getElementById('score-white').textContent=scores[2];
}

function showWinOverlay(player){
  const overlay=document.getElementById('overlay');
  const stone=document.getElementById('modal-stone');
  const winner=document.getElementById('modal-winner');
  const sub=document.getElementById('modal-sub');
  stone.className=`modal-stone ${player===1?'black-stone':'white-stone'}`;
  stone.style.background=''; stone.style.boxShadow='';
  let isHuman;
  if(gameMode==='ai') isHuman=player===humanPlayer;
  else isHuman=player===myOnlinePlayer;
  winner.textContent=isHuman?'ZEST 승리! 🎉':'ZAIST 승리!';
  sub.textContent=isHuman?'당신이 이겼습니다!':(gameMode==='ai'?'🤖 AI가 이겼습니다':'상대방이 이겼습니다');
  showOverlay('overlay');
}

function showDrawOverlay(){
  const overlay=document.getElementById('overlay');
  document.getElementById('modal-stone').style.background='linear-gradient(135deg,#222 50%,#ccc 50%)';
  document.getElementById('modal-stone').style.boxShadow='0 4px 20px rgba(0,0,0,0.5)';
  document.getElementById('modal-winner').textContent='무승부!';
  document.getElementById('modal-sub').textContent='보드가 가득 찼습니다';
  showOverlay('overlay');
}

function closeOverlay(){ hideOverlay('overlay'); }

function rematch(){ if(gameMode==='online'&&onlineStarted) onlineRematch(); else newGame(); }

function showEndOverlay(title,sub){
  const stone=document.getElementById('modal-stone');
  stone.className='modal-stone';
  stone.style.background='linear-gradient(135deg,#222 50%,#ccc 50%)';
  document.getElementById('modal-winner').textContent=title;
  document.getElementById('modal-sub').textContent=sub;
  showOverlay('overlay');
}

function newGame(){
  const inGame=!gameOver&&board.some(r=>r.some(Boolean))&&((gameMode==='online'&&onlineStarted)||gameMode==='ai');
  if(inGame&&!confirm('진행 중인 대국을 종료하고 나가시겠습니까?'))return;
  closeOverlay();
  destroyPeer();
  document.getElementById('conn-status').style.display='none';
  showOverlay('mode-overlay');
}

function doNewOnlineGame(){
  closeOverlay();
  restartPending=false; incomingRestart=false;
  gameOver=false; aiThinking=false; currentPlayer=1;
  initBoard(); updateTurn(); setAiThinking(false);
}

function resetScore(){ if((scores[1]||scores[2])&&!confirm('전적을 초기화할까요?'))return; scores={1:0,2:0}; updateScores(); }

// ─── INPUT HANDLING ───────────────────────────────────────────
clickCanvas.addEventListener('mousemove',(e)=>{
  const isMyTurn = gameMode==='ai'?currentPlayer===humanPlayer:currentPlayer===myOnlinePlayer;
  if(gameOver||!isMyTurn||aiThinking){ghost.style.display='none';return;}
  const rect=clickCanvas.getBoundingClientRect();
  const scaleX=CANVAS_SIZE/rect.width,scaleY=CANVAS_SIZE/rect.height;
  const x=(e.clientX-rect.left)*scaleX,y=(e.clientY-rect.top)*scaleY;
  const pos=colRowFromXY(x,y);
  if(pos&&board[pos.row][pos.col]===0){
    ghost.style.display='block';
    ghost.style.left=(MARGIN+pos.col*CELL)+'px';
    ghost.style.top=(MARGIN+pos.row*CELL)+'px';
    const myStone=gameMode==='ai'?humanPlayer:myOnlinePlayer;
    ghost.className=`ghost-stone ${myStone===1?'black-ghost':'white-ghost'}`;
    clickCanvas.style.cursor='pointer';
  } else { ghost.style.display='none'; clickCanvas.style.cursor='default'; }
});

clickCanvas.addEventListener('mouseleave',()=>{ghost.style.display='none';});

// Keyboard play: arrows move the cursor, Enter/Space place a stone
const kbCursor = document.getElementById('kb-cursor');
let kb = {row: 7, col: 7};
function kbShow() {
  kbCursor.style.display = 'block';
  kbCursor.style.left = (MARGIN + kb.col * CELL) + 'px';
  kbCursor.style.top = (MARGIN + kb.row * CELL) + 'px';
  const isMyTurn = gameMode === 'ai' ? currentPlayer === humanPlayer : currentPlayer === myOnlinePlayer;
  if (!gameOver && isMyTurn && !aiThinking && board[kb.row][kb.col] === 0) {
    const myStone = gameMode === 'ai' ? humanPlayer : myOnlinePlayer;
    ghost.style.display = 'block';
    ghost.style.left = kbCursor.style.left; ghost.style.top = kbCursor.style.top;
    ghost.className = `ghost-stone ${myStone === 1 ? 'black-ghost' : 'white-ghost'}`;
  } else ghost.style.display = 'none';
}
function kbHide() { kbCursor.style.display = 'none'; ghost.style.display = 'none'; }
clickCanvas.addEventListener('focus', () => { if (document.activeElement === clickCanvas && clickCanvas.matches(':focus-visible')) kbShow(); });
clickCanvas.addEventListener('blur', kbHide);
clickCanvas.addEventListener('mousedown', kbHide);
clickCanvas.addEventListener('keydown', (e) => {
  const d = {ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]}[e.key];
  if (d) {
    e.preventDefault();
    kb.row = Math.max(0, Math.min(BOARD_SIZE - 1, kb.row + d[0]));
    kb.col = Math.max(0, Math.min(BOARD_SIZE - 1, kb.col + d[1]));
    kbShow();
    const v = board[kb.row][kb.col];
    announce(coordName(kb.row, kb.col) + (v ? (v === 1 ? ', 흑돌' : ', 백돌') : ', 빈 칸'));
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    handleClick(kb.row, kb.col);
    kbShow();
  }
});

clickCanvas.addEventListener('click',(e)=>{
  if(gameOver||aiThinking)return;
  const rect=clickCanvas.getBoundingClientRect();
  const scaleX=CANVAS_SIZE/rect.width,scaleY=CANVAS_SIZE/rect.height;
  const x=(e.clientX-rect.left)*scaleX,y=(e.clientY-rect.top)*scaleY;
  const pos=colRowFromXY(x,y);
  if(pos)handleClick(pos.row,pos.col);
});

clickCanvas.addEventListener('touchend',(e)=>{
  if(gameOver||aiThinking)return;
  e.preventDefault();
  const touch=e.changedTouches[0];
  const rect=clickCanvas.getBoundingClientRect();
  const scaleX=CANVAS_SIZE/rect.width,scaleY=CANVAS_SIZE/rect.height;
  const x=(touch.clientX-rect.left)*scaleX,y=(touch.clientY-rect.top)*scaleY;
  const pos=colRowFromXY(x,y);
  if(pos)handleClick(pos.row,pos.col);
});

// Enter key for room join
document.getElementById('join-code-input').addEventListener('keydown',(e)=>{
  if(e.key==='Enter')joinRoom();
});

function scaleBoard(){
  const narrow=window.matchMedia('(max-width: 900px)').matches;
  // chrome = side panels/gaps/paddings around the board (see @media above)
  // innerWidth is inflated on mobile while the unscaled board overflows; screen.width is not
  const vw=Math.min(window.innerWidth,screen.width);
  const maxW=narrow?vw-52:Math.min(window.innerWidth-520,700);
  const maxH=narrow?Math.max(window.innerHeight-300,300):window.innerHeight-200;
  const scale=Math.max(0.3,Math.min(maxW/CANVAS_SIZE,maxH/CANVAS_SIZE,1));
  const surface=document.getElementById('board-surface');
  surface.style.transform=`scale(${scale})`;
  surface.style.transformOrigin='top left';
  // transform doesn't change layout size: shrink layout box so wrap/indicators fit
  surface.style.marginRight=surface.style.marginBottom=-(CANVAS_SIZE*(1-scale))+'px';
}
window.addEventListener('resize',scaleBoard);
window.addEventListener('orientationchange',scaleBoard);

// Init
initBoard(); updateTurn(); updateScores(); scaleBoard();
showOverlay('mode-overlay');

</script>
